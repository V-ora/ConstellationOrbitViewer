name: 自动更新轨道数据

# 为什么要有这个：GitHub Pages 只发静态文件，自己不会去抓 TLE。
# 这个工作流每 12 小时在 GitHub 的服务器上跑一遍「追平历史 → 重生成两张爬升大图 →
# 重新烘一份 docs/ 快照」，然后提交回仓库；Pages 检测到 main 有变化会自动重新发布。
#
# 手动触发：仓库页 Actions → 左侧「自动更新轨道数据」→ Run workflow

on:
  schedule:
    # GitHub 的 cron 用 UTC。每 12 小时一次，落在 UTC 00:00 / 12:00
    # = 北京时间 08:00 / 20:00。（高峰期可能延迟几分钟到半小时，属正常）
    - cron: "0 */12 * * *"
  workflow_dispatch:

# 需要写权限才能把更新提交回仓库
permissions:
  contents: write

# 同一时间只允许一个更新在跑，避免两次提交打架
concurrency:
  group: update-orbital-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 取出仓库
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- 以下三步都依赖外网（CelesTrak）。任何一步失败都不该拖垮整体：
      #      历史/大图没更新，至少根数（下一步）还能刷新。失败原因在 Actions 日志里能看到。
      - name: 1/4 追平逐日历史末点
        continue-on-error: true
        run: python local_backfill.py

      - name: 2/4 重生成千帆爬升大图
        continue-on-error: true
        run: python make_qf_html.py

      - name: 3/4 重生成中国星网爬升大图
        continue-on-error: true
        run: python make_gw_html.py

      # ---- 核心：重新抓 TLE 并烘出 docs/ 快照（这一步失败就整体失败，因为没有新数据可发）
      - name: 4/4 重新生成静态站 docs/
        run: python build_pages.py

      - name: 提交并推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data cache web/raise docs
          if git diff --cached --quiet; then
            echo "本次没有产生变化，跳过提交。"
            exit 0
          fi
          git commit -m "自动更新轨道数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
